server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;

    # O Vite gera nomes com hash: o conteúdo nunca muda sob a mesma URL.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # O index é o ponto de entrada e aponta para os assets com hash — precisa
    # ser revalidado sempre, ou um deploy novo não chega ao navegador.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # É o proxy que torna tudo mesma origem: o SPA chama /api relativo e nunca
    # há preflight nem cookie cross-site.
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Imagens de produto, servidas pela API.
    location /static/ {
        proxy_pass http://api:8000/static/;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=86400";
    }

    # Métricas não vão para a internet. Sem esta regra, o fallback do SPA
    # abaixo devolveria o index.html em /metrics — inofensivo, mas confuso:
    # 404 explícito diz que o caminho não existe aqui, de propósito.
    location = /metrics {
        return 404;
    }

    # Fallback do SPA. Sem isto, um F5 em /detail/3 devolve 404 do nginx,
    # porque não existe arquivo nesse caminho.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
