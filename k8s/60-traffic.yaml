# Gerador de trafego.
#
# Nao e enfeite. Sem requisicao continua o Prometheus nao tem serie de latencia
# nem de status, o Loki fica sem linha de acesso, e as tres trilhas de
# investigacao do harness voltam vazias — um incidente injetado num ambiente
# silencioso nao produz o contraste "antes x depois" que o diagnostico precisa.
#
# Carga deliberadamente baixa (~1 req/s por caminho): o objetivo e serie
# continua, nao teste de carga. O cenario de saturacao aumenta isso a parte.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-shop-traffic
  namespace: fake-shop
  labels:
    app.kubernetes.io/name: fake-shop-traffic
    app.kubernetes.io/part-of: fake-shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fake-shop-traffic
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fake-shop-traffic
        app.kubernetes.io/part-of: fake-shop
    spec:
      containers:
        - name: traffic
          image: curlimages/curl:8.11.1
          # command, nao args: a imagem tem ENTRYPOINT ["curl"], entao args
          # viraria "curl sh -c ...".
          command:
            - sh
            - -c
            # Sem $( ) de proposito: o Kubernetes expande a sintaxe $(VAR) em
            # command/args antes do shell ver, e uma substituicao de comando
            # ali e ambigua. O -w do curl ja imprime o status.
            - |
              BASE=http://fake-shop-web.fake-shop.svc.cluster.local
              while true; do
                for p in / /api/products /api/health /api/health/ready; do
                  curl -s -o /dev/null -m 5 \
                    -w "traffic path=$p status=%{http_code} time=%{time_total}s\n" \
                    "$BASE$p" || echo "traffic path=$p status=000"
                done
                sleep 1
              done
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
